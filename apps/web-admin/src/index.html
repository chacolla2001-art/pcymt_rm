<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Realidad Mixta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Tema antes del primer paint para evitar flash negro en modo claro -->
  <script>
    (function () {
      var key = 'theme-mode';
      var saved = localStorage.getItem(key) || 'light';
      var dark = saved === 'dark' ||
        (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.classList.add(dark ? 'dark-theme' : 'light-theme');
      root.style.backgroundColor = dark ? '#121212' : '#fafafa';
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: #fafafa;
      color: #1c1b1f;
    }
    html.dark-theme, html.dark-theme body {
      background-color: #121212;
      color: #e6e1e5;
    }
    app-root {
      display: block;
      min-height: 100%;
      background-color: inherit;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Runtime environment configuration -->
  <script src="assets/env.js"></script>
  <!-- Google Maps API - key loaded from environment -->
  <script>
    // Load Google Maps dynamically to avoid hardcoded API key
    (function() {
      var apiKey = window.__GOOGLE_MAPS_API_KEY__ || '';
      if (apiKey) {
        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + apiKey + '&v=beta';
        script.defer = true;
        document.head.appendChild(script);
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="mat-typography">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
